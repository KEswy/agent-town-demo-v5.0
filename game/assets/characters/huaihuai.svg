<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <title>坏坏小恐龙</title>
  <desc>嫩绿色、浅蓝背鳍、黄色肚皮，戴着浅蓝围巾的友好像素小恐龙。</desc>

  <!-- Tail and sky-blue back plates establish the dinosaur silhouette. -->
  <polygon points="45,40 61,35 58,45 63,50 48,53" fill="#4f8f58"/>
  <polygon points="14,13 18,4 23,13" fill="#78c9df"/>
  <polygon points="24,10 29,1 34,11" fill="#78c9df"/>
  <polygon points="36,11 42,3 46,14" fill="#78c9df"/>

  <!-- Head, muzzle and tiny brow blocks. -->
  <polygon points="14,9 47,9 54,16 54,34 48,40 14,40 8,34 8,16" fill="#79bd67"/>
  <rect x="12" y="13" width="38" height="24" fill="#8dce73"/>
  <rect x="16" y="25" width="40" height="13" fill="#a3da7e"/>
  <rect x="18" y="17" width="9" height="8" fill="#f8f4df"/>
  <rect x="39" y="17" width="9" height="8" fill="#f8f4df"/>
  <rect x="22" y="19" width="4" height="6" fill="#202b29"/>
  <rect x="40" y="19" width="4" height="6" fill="#202b29"/>
  <rect x="23" y="19" width="2" height="2" fill="#ffffff"/>
  <rect x="41" y="19" width="2" height="2" fill="#ffffff"/>
  <rect x="27" y="29" width="3" height="3" fill="#4f7950"/>
  <rect x="43" y="29" width="3" height="3" fill="#4f7950"/>
  <rect x="13" y="29" width="5" height="4" fill="#f2a7a0"/>
  <rect x="50" y="29" width="5" height="4" fill="#f2a7a0"/>
  <rect x="30" y="34" width="13" height="2" fill="#47624a"/>
  <rect x="32" y="36" width="3" height="3" fill="#fff8e7"/>
  <rect x="39" y="36" width="3" height="3" fill="#fff8e7"/>

  <!-- Scarf, round body, little arms and yellow belly. -->
  <rect x="17" y="38" width="31" height="6" fill="#8ad4e7"/>
  <rect x="42" y="41" width="7" height="15" fill="#62b8d2"/>
  <polygon points="18,43 47,43 52,59 13,59" fill="#79bd67"/>
  <rect x="26" y="44" width="15" height="15" fill="#f3d66b"/>
  <rect x="29" y="47" width="9" height="12" fill="#ffe899"/>
  <polygon points="16,45 7,49 9,54 20,51" fill="#5a9c5d"/>
  <polygon points="46,45 56,48 54,53 43,51" fill="#5a9c5d"/>
  <rect x="10" y="56" width="18" height="6" fill="#4f8f58"/>
  <rect x="36" y="56" width="18" height="6" fill="#4f8f58"/>
  <rect x="11" y="60" width="6" height="2" fill="#f8f4df"/>
  <rect x="47" y="60" width="6" height="2" fill="#f8f4df"/>
</svg>
