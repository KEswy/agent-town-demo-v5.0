name: Agent Town CI

on:
  push:
    branches:
      - main
      - v4-development
      - v5-development
  pull_request:
    branches:
      - main
      - v4-development
      - v5-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-town-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENABLE_LLM: "false"
  LLM_PROVIDER: mock
  LLM_BASE_URL: ""
  LLM_API_KEY: ""
  AGENT_TOWN_DISABLE_VECTOR_RAG: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  offline-core:
    name: Offline core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned direct dependencies
        run: |
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check
          python -m pip freeze --all

      - name: Run offline Python and document contracts
        env:
          AGENT_TOWN_GAME_SAVE_DIR: ${{ runner.temp }}/agent-town-games
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/agent-town-pycache
        run: python scripts/smoke_check.py --profile core

      - name: Assert checks did not mutate tracked files
        run: git diff --exit-code

  policy-training:
    name: NPC policy training pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate small teacher sets and train linear artifacts for every task
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/agent-town-pycache
        run: |
          set -euo pipefail
          mkdir -p /tmp/policy-artifacts
          for task in exile_vote sheriff_vote sheriff_nomination night_target; do
            python backend/training/generate_policy_dataset.py \
              --seed 20260701 --games 6 --task "$task" \
              --output "/tmp/${task}_teacher.jsonl"
            python backend/training/validate_policy_dataset.py \
              --input "/tmp/${task}_teacher.jsonl" \
              --output "/tmp/${task}_normalized.jsonl"
            python backend/training/train_policy.py \
              --dataset "/tmp/${task}_teacher.jsonl" \
              --model-type linear --task "$task" \
              --output-dir /tmp/policy-artifacts
          done

      - name: Assert checks did not mutate tracked files
        run: git diff --exit-code

  godot-headless:
    name: Godot headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Godot 4.7.1
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Run Godot resource and scene checks
        env:
          AGENT_TOWN_GAME_SAVE_DIR: ${{ runner.temp }}/agent-town-games
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/agent-town-pycache
        run: |
          godot --version
          python scripts/smoke_check.py --profile godot

      - name: Assert checks did not mutate tracked files
        run: git diff --exit-code
