<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Town 实时观战</title>
<style>
  :root {
    --bg: #0d1b2a;
    --panel: #1b2838;
    --panel2: #243447;
    --line: #33475f;
    --text: #e8edf2;
    --muted: #8fa3b8;
    --accent: #66c2ff;
    --good: #7bd88f;
    --wolf: #ff8f8f;
    --out: #5b6b7c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  header select, header button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel2);
    border: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .pill.accent { color: var(--accent); border-color: var(--accent); }
  .pill.good { color: var(--good); border-color: var(--good); }
  .pill.wolf { color: var(--wolf); border-color: var(--wolf); }
  main { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 14px; padding: 14px 18px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  section h2 {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .card {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .card.out { opacity: .55; filter: grayscale(.8); }
  .card .name { font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .card .tag { font-size: 11px; padding: 1px 6px; border-radius: 999px; margin-left: 4px; }
  .tag.sheriff { background: #3d5a80; color: #fff; }
  .tag.player { background: #7a5c1e; color: #fff; }
  .tag.idiot { background: #6d4c7a; color: #fff; }
  #timeline { max-height: 62vh; overflow-y: auto; }
  #timeline .row {
    padding: 7px 2px;
    border-bottom: 1px dashed var(--line);
    color: var(--text);
    line-height: 1.45;
  }
  #timeline .row:last-child { border-bottom: none; }
  #timeline .time { color: var(--muted); font-size: 11px; margin-right: 8px; }
  #empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  #status { font-size: 12px; color: var(--muted); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🐺 Agent Town 实时观战</h1>
  <select id="gameSelect"></select>
  <button id="refreshBtn" title="立即刷新">刷新</button>
  <span id="status"></span>
</header>
<main>
  <div style="display:grid; gap:14px; align-content:start;">
    <section>
      <h2>对局状态</h2>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <span class="pill" id="phasePill">-</span>
        <span class="pill" id="dayPill">-</span>
        <span class="pill" id="winnerPill" style="display:none;">-</span>
        <span class="pill accent" id="speakerPill" style="display:none;">-</span>
      </div>
    </section>
    <section>
      <h2>角色状态</h2>
      <div class="grid" id="charGrid"></div>
    </section>
  </div>
  <section>
    <h2>公开时间线</h2>
    <div id="timeline"></div>
    <div id="empty">暂未选择对局。</div>
  </section>
</main>
<script>
const PHASE_LABELS = {
  NIGHT: "🌙 夜晚", HUNTER_SHOT: "🔫 猎人开枪", SHERIFF_SIGNUP: "🚨 警上报名",
  SHERIFF_SPEECH: "🚨 竞选发言", SHERIFF_WITHDRAWAL: "🚨 退水", SHERIFF_VOTE: "🗳 警长投票",
  SHERIFF_RUNOFF_SPEECH: "⚖️ 平票 PK", SHERIFF_RUNOFF_VOTE: "⚖️ PK 投票",
  MEETING_ORDER: "🗣 警长选发言侧", DAY_MEETING: "☀️ 白天会议",
  SHERIFF_NOMINATION: "🗣 警长归票", FREE_ACTIVITY: "🚶 自由活动",
  VOTE: "🗳 放逐投票", BADGE_TRANSFER: "🎖 移交警徽", GAME_OVER: "🏁 游戏结束",
};
const ROLE_LABELS = { seer: "预言家", witch: "女巫", hunter: "猎人", guard: "守卫", villager: "村民", werewolf: "狼人", idiot: "白痴" };
let activeGame = "";
let pollTimer = null;

async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status + " " + res.statusText);
  return res.json();
}

async function loadGames() {
  const sel = document.getElementById("gameSelect");
  const before = activeGame;
  sel.innerHTML = "";
  let games = [];
  try {
    games = await fetchJson("/api/spectate/active-games");
  } catch (err) {
    document.getElementById("status").textContent = "后端未连接：" + err.message;
    return;
  }
  if (!games.length) {
    sel.innerHTML = '<option value="">（暂无进行中的对局）</option>';
    document.getElementById("status").textContent = "暂无进行中的对局。";
    return;
  }
  for (const g of games) {
    const opt = document.createElement("option");
    opt.value = g.game_id;
    opt.textContent = g.game_id + " · 第" + g.day + "天 · " + (PHASE_LABELS[g.phase] || g.phase) + " · " + g.player_name;
    sel.appendChild(opt);
  }
  if (before && games.some(g => g.game_id === before)) {
    sel.value = before;
  }
  activeGame = sel.value || games[0].game_id;
  sel.value = activeGame;
  startPolling();
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  refresh();
  pollTimer = setInterval(refresh, 1500);
}

async function refresh() {
  const sel = document.getElementById("gameSelect");
  const gameId = sel.value || activeGame;
  if (!gameId) return;
  activeGame = gameId;
  let data;
  try {
    data = await fetchJson("/api/spectate/" + encodeURIComponent(gameId));
  } catch (err) {
    document.getElementById("status").textContent = "读取失败：" + err.message;
    return;
  }
  document.getElementById("status").textContent = "更新于 " + new Date().toLocaleTimeString();
  render(data);
}

function render(data) {
  document.getElementById("phasePill").textContent = PHASE_LABELS[data.phase] || data.phase;
  document.getElementById("dayPill").textContent = "第 " + data.day + " 天";
  const winnerPill = document.getElementById("winnerPill");
  if (data.winner) {
    winnerPill.style.display = "";
    winnerPill.textContent = data.winner === "good" ? "好人胜利" : "狼人胜利";
    winnerPill.className = "pill " + (data.winner === "good" ? "good" : "wolf");
  } else {
    winnerPill.style.display = "none";
  }
  const speakerPill = document.getElementById("speakerPill");
  const speakerId = data.meeting && data.meeting.current_speaker_id;
  if (data.phase === "DAY_MEETING" && speakerId) {
    speakerPill.style.display = "";
    const c = data.characters.find(ch => ch.id === speakerId);
    speakerPill.textContent = "当前发言：" + (c ? c.name : speakerId);
  } else {
    speakerPill.style.display = "none";
  }

  const grid = document.getElementById("charGrid");
  grid.innerHTML = "";
  for (const c of data.characters) {
    const card = document.createElement("div");
    card.className = "card" + (c.alive ? "" : " out");
    const nameLine = document.createElement("div");
    nameLine.className = "name";
    nameLine.textContent = c.id + " " + c.name;
    if (c.is_player) nameLine.insertAdjacentHTML("beforeend", '<span class="tag player">玩家</span>');
    if (c.is_sheriff) nameLine.insertAdjacentHTML("beforeend", '<span class="tag sheriff">警长</span>');
    if (c.idiot_flipped) nameLine.insertAdjacentHTML("beforeend", '<span class="tag idiot">白痴翻牌</span>');
    card.appendChild(nameLine);
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = c.alive ? "存活" : "已出局";
    if (c.claimed_role) meta.textContent += " · 声明：" + (ROLE_LABELS[c.claimed_role] || c.claimed_role);
    card.appendChild(meta);
    grid.appendChild(card);
  }

  const timeline = document.getElementById("timeline");
  const empty = document.getElementById("empty");
  timeline.innerHTML = "";
  empty.style.display = "none";
  const rows = [];
  const timelineData = data.public_evidence_timeline || {};
  const items = timelineData.items || [];
  for (const item of items) {
    if (item.display_text) rows.push("◇ " + item.display_text);
  }
  for (const claim of data.public_intel || []) {
    if (claim.display_text) rows.push("◆ " + claim.display_text);
  }
  for (const log of data.public_logs || []) {
    rows.push("● " + log);
  }
  if (!rows.length) {
    empty.style.display = "";
  }
  rows.forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "row";
    const time = document.createElement("span");
    time.className = "time";
    time.textContent = String(i + 1).padStart(2, "0");
    row.appendChild(time);
    row.appendChild(document.createTextNode(text));
    timeline.appendChild(row);
  });
  timeline.scrollTop = timeline.scrollHeight;
}

document.getElementById("gameSelect").addEventListener("change", function () {
  activeGame = this.value;
  startPolling();
});
document.getElementById("refreshBtn").addEventListener("click", refresh);
loadGames();
</script>
</body>
</html>
